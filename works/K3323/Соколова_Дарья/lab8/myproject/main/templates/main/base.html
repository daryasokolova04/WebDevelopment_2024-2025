{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Мой сайт{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'main/css/styles.css' %}">
    <link rel="icon" href="{% static 'main/img/logo.png' %}">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="logo">
                <img src="{% static 'main/img/logo.png' %}" alt="Логотип">
            </div>
            <nav class="nav">
                <a href="{% url 'home' %}" class="nav-link">Главная</a>
                <a href="{% url 'about' %}" class="nav-link">О разработке</a>
                <a href="{% url 'contact' %}" class="nav-link">Обратная связь</a>
            </nav>
        </div>
    </header>

    <main class="main">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="footer">
        <div class="container">
            <p>© 2025 Проект на Django</p>
        </div>
    </footer>
</body>
</html>
