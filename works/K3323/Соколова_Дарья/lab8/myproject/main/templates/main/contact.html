{% extends 'main/base.html' %}
{% load static %} 

{% block title %}Обратная связь{% endblock %}

{% block content %}
<div class="content">
    <h1>Обратная связь</h1>

    {% if success %}
    <div class="success-message">
        <p>Спасибо за ваше сообщение!</p>
    </div>
    {% else %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Отправить</button>
    </form>

    {% endif %}
</div>
{% endblock %}
